<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>变更流程处理时长</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="titleHead">变更流程处理时长</h1>
      <label class="continuous-toggle" title="勾选后，切到其它标签页查资料时仍继续计时；页面加载期间的时间先暂存，加载完若本页需要计时就归本页，否则归还给刚进入后台的流程；另一条流程开始计时或关闭本标签才停止。">
        <input type="checkbox" id="chkContinuous">
        <span>切标签继续计时</span>
      </label>
    </header>

    <div class="filterbar">
      <button id="btnPrev" type="button" class="nav" title="前一天">‹</button>
      <input type="date" id="datePicker" title="选择日期">
      <button id="btnNext" type="button" class="nav" title="后一天">›</button>
      <button id="btnToday" type="button" class="nav today">今天</button>
    </div>

    <div class="table-scroll">
      <table id="grid">
        <thead>
          <tr>
            <th class="col-flow">流程编号</th>
            <th class="col-project">项目号</th>
            <th class="col-date">日期</th>
            <th class="col-sec">停留时长(秒)</th>
            <th class="col-op">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div id="empty" class="empty" hidden>该日期暂无记录。可切换日期，或打开网址含 SSM087 的流程详情页停留一会儿。</div>

    <footer>
      <span id="total"></span>
      <div class="actions">
        <button id="btnExport" type="button">导出 CSV</button>
        <button id="btnExportJson" type="button">导出 JSON</button>
        <button id="btnImportJson" type="button">导入 JSON</button>
        <button id="btnClear" type="button" class="danger">清空记录</button>
      </div>
    </footer>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
  <script src="popup.js"></script>
</body>
</html>
